<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>LoLz.Live идеяы</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <img src="lzt.png" class="lzt">
  <img src="https://nztcdn.com/files/1db0e9d7-5851-417b-9cd4-3636534476d9.webp" class="lzt1">
  <div class="pla1">
    <div class="player">
      <audio id="audio" src="love.mp3" preload="auto"></audio>

      <div class="controls">
        <button class="play-btn" id="playPauseBtn"></button>

        <div class="progress-container" id="progressContainer">
          <div class="progress" id="progress"></div>
        </div>

        <div class="time" id="duration">0:00</div>
      </div>
    </div>

    <div class="volume-container">
      <input type="range" min="0" max="1" step="0.01" value="1" id="volumeSlider" class="volume-slider">
    </div>
  </div>

  <a href="https://lolz.live/threads/8864532/" class="tema">Тема на форуме</a>
  <script>
    const audio = document.getElementById('audio');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const progress = document.getElementById('progress');
    const progressContainer = document.getElementById('progressContainer');
    const durationText = document.getElementById('duration');
    const volumeSlider = document.getElementById('volumeSlider');

    let isPlaying = false;

    
    const savedVolume = localStorage.getItem('volume');
    if (savedVolume !== null) {
      audio.volume = parseFloat(savedVolume);
      volumeSlider.value = savedVolume;
    }

   
    const updateButton = () => {
      playPauseBtn.innerHTML = isPlaying
        ? `<svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="5" height="20" fill="#080808"/>
<rect x="15" width="5" height="20" fill="#080808"/>
</svg>
`
        : `<svg width="19" height="20" viewBox="0 0 19 20" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M0 0L7.5 4L18.5 10L7 16L0 20V0Z" fill="#080808"/>
</svg>
`;
    };

    playPauseBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        isPlaying = true;
      } else {
        audio.pause();
        isPlaying = false;
      }
      updateButton();
    });

   
    audio.addEventListener('timeupdate', () => {
      const percent = (audio.currentTime / audio.duration) * 100;
      progress.style.width = percent + '%';

      const minutes = Math.floor(audio.currentTime / 60);
      const seconds = Math.floor(audio.currentTime % 60).toString().padStart(2, '0');
      durationText.textContent = `${minutes}:${seconds}`;
    });

    
    progressContainer.addEventListener('click', (e) => {
      const width = progressContainer.clientWidth;
      const clickX = e.offsetX;
      const duration = audio.duration;
      audio.currentTime = (clickX / width) * duration;
    });

    
    volumeSlider.addEventListener('input', () => {
      const volume = parseFloat(volumeSlider.value);
      audio.volume = volume;
      localStorage.setItem('volume', volume);
    });
  
audio.addEventListener('play', () => localStorage.setItem('isPlaying', 'true'));
audio.addEventListener('pause', () => localStorage.setItem('isPlaying', 'false'));


window.addEventListener('load', () => {
  if (localStorage.getItem('isPlaying') === 'true') {
    audio.play().catch(() => {});
    isPlaying = true;
    updateButton();
  }
});

audio.addEventListener('timeupdate', () => {
  localStorage.setItem('currentTime', audio.currentTime);
});


window.addEventListener('load', () => {
  const savedTime = parseFloat(localStorage.getItem('currentTime'));
  if (!isNaN(savedTime)) {
    audio.currentTime = savedTime;
  }
});


    updateButton();
  </script>
</body>
</html>
