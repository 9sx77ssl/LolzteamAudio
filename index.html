<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML5 Audio Player</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="top-banners" aria-hidden="true">
    <img src="lzt.png" class="brand-logo" alt="">
    <img
      src="https://nztcdn.com/files/1db0e9d7-5851-417b-9cd4-3636534476d9.webp"
      class="brand-badge"
      alt=""
    >
  </div>

  <main class="page">
    <section class="audio-player" aria-label="Аудиоплеер">
      <audio id="audio" src="python.mp3" preload="auto"></audio>

      <button
        class="play-toggle"
        id="playPauseBtn"
        type="button"
        aria-label="Воспроизвести"
        aria-pressed="false"
      ></button>

      <button
        class="progress-container"
        id="progressContainer"
        type="button"
        aria-label="Перемотка аудио"
      >
        <span class="progress-track"></span>
        <span class="progress" id="progress"></span>
      </button>

      <div class="time" id="currentTime">0:00</div>

      <label class="volume-control" for="volumeSlider" aria-label="Громкость">
        <input
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="1"
          id="volumeSlider"
          class="volume-slider"
        >
      </label>
    </section>
  </main>

  <script>
    const audio = document.getElementById('audio');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const progress = document.getElementById('progress');
    const progressContainer = document.getElementById('progressContainer');
    const currentTimeText = document.getElementById('currentTime');
    const volumeSlider = document.getElementById('volumeSlider');

    const icons = {
      play: `
        <svg viewBox="0 0 24 24" aria-hidden="true" role="presentation">
          <path d="M9 7v10l8-5-8-5Z"></path>
        </svg>
      `,
      pause: `
        <svg viewBox="0 0 24 24" aria-hidden="true" role="presentation">
          <rect x="8" y="7" width="3" height="10" rx="1"></rect>
          <rect x="13" y="7" width="3" height="10" rx="1"></rect>
        </svg>
      `
    };

    const formatTime = (value) => {
      if (!Number.isFinite(value)) {
        return '0:00';
      }

      const minutes = Math.floor(value / 60);
      const seconds = Math.floor(value % 60).toString().padStart(2, '0');
      return `${minutes}:${seconds}`;
    };

    const updatePlayButton = () => {
      const isPlaying = !audio.paused;
      playPauseBtn.innerHTML = isPlaying ? icons.pause : icons.play;
      playPauseBtn.setAttribute('aria-label', isPlaying ? 'Пауза' : 'Воспроизвести');
      playPauseBtn.setAttribute('aria-pressed', String(isPlaying));
    };

    const updateProgress = () => {
      const duration = audio.duration || 0;
      const percent = duration ? (audio.currentTime / duration) * 100 : 0;

      progress.style.width = `${percent}%`;
      currentTimeText.textContent = formatTime(audio.currentTime);
    };

    const savedVolume = localStorage.getItem('volume');
    if (savedVolume !== null) {
      const parsedVolume = parseFloat(savedVolume);
      if (!Number.isNaN(parsedVolume)) {
        audio.volume = parsedVolume;
        volumeSlider.value = savedVolume;
      }
    }

    playPauseBtn.addEventListener('click', async () => {
      if (audio.paused) {
        try {
          await audio.play();
        } catch (error) {
          return;
        }
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('loadedmetadata', updateProgress);
    audio.addEventListener('timeupdate', () => {
      localStorage.setItem('currentTime', String(audio.currentTime));
      updateProgress();
    });
    audio.addEventListener('play', () => {
      localStorage.setItem('isPlaying', 'true');
      updatePlayButton();
    });
    audio.addEventListener('pause', () => {
      localStorage.setItem('isPlaying', 'false');
      updatePlayButton();
    });
    audio.addEventListener('ended', () => {
      audio.currentTime = 0;
      localStorage.setItem('isPlaying', 'false');
      updateProgress();
      updatePlayButton();
    });

    progressContainer.addEventListener('click', (event) => {
      const duration = audio.duration;
      if (!duration) {
        return;
      }

      const bounds = progressContainer.getBoundingClientRect();
      const clickX = event.clientX - bounds.left;
      const nextTime = Math.max(0, Math.min(clickX / bounds.width, 1)) * duration;
      audio.currentTime = nextTime;
      localStorage.setItem('currentTime', String(nextTime));
      updateProgress();
    });

    volumeSlider.addEventListener('input', () => {
      const volume = parseFloat(volumeSlider.value);
      audio.volume = volume;
      localStorage.setItem('volume', String(volume));
    });

    window.addEventListener('load', async () => {
      const savedTime = parseFloat(localStorage.getItem('currentTime'));
      if (!Number.isNaN(savedTime)) {
        audio.currentTime = savedTime;
      }

      if (localStorage.getItem('isPlaying') === 'true') {
        try {
          await audio.play();
        } catch (error) {
          audio.pause();
        }
      }

      updateProgress();
      updatePlayButton();
    });

    updateProgress();
    updatePlayButton();
  </script>
</body>
</html>
